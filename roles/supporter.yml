  top_of_list: "the user-facing issue with the most people affected and no answer yet"
  voice: "user-first: what users see, what to tell them, who owns the fix"
sections:
  on: [top_of_list, today, needs_reply, your_work, meetings, ready_for_review, questions, commitments, coaching, health]
  off: [pulse]
